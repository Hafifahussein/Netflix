<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETFLIX - Premium Free Streaming</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="index-page">
    <header class="main-header">
        <nav>
            <div class="logo">NETFLIX</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="browse.html">Browse</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="manage.html">Manage</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Premium Movies, Totally Free</h1>
                <p>No subscriptions. No hidden fees. Just great movies.</p>
                <a href="browse.html" class="btn">Browse Movies</a>
            </div>
        </section>

        <section class="featured">
            <h2>Popular Movies</h2>
            <div class="carousel" id="featured-carousel">
            </div>
        </section>

        <section class="genres">
            <h2>Browse by Genre</h2>
            <div class="genre-grid">
                <div class="genre-card" data-genre="action">
                    <h3>Action</h3>
                </div>
                <div class="genre-card" data-genre="comedy">
                    <h3>Comedy</h3>
                </div>
                <div class="genre-card" data-genre="drama">
                    <h3>Drama</h3>
                </div>
                <div class="genre-card" data-genre="sci-fi">
                    <h3>Sci-Fi</h3>
                </div>
            </div>
        </section>
    </main>

<div id="movie-modal" class="modal">
</div>

    <footer>
        <p>&copy; 2025 NETFLIX. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
