<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Movies | NETFLIX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="manage-page">
    <header class="main-header">
        <nav>
            <div class="logo">NETFLIX</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="browse.html">Browse</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="manage.html">Manage</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="manage-section">
            <h1>Manage Movies</h1>
          
<form id="movie-form">
    <div class="form-group">
        <label for="title">Movie Title *</label>
        <input type="text" id="title" name="title" required>
    </div>

    <div class="form-group">
        <label for="genre">Genre</label>
        <select id="genre" name="genre" required>
            <option value="action">Action</option>
            <option value="comedy">Comedy</option>
            <option value="drama">Drama</option>
            <option value="sci-fi">Sci-Fi</option>
            <option value="horror">Horror</option>
            <option value="thriller">Thriller</option>
        </select>
    </div>

    <div class="form-group">
        <label for="year">Year</label>
        <input type="number" id="year" name="year" min="1900" max="2030">
    </div>

    <div class="form-group">
        <label for="poster">Poster URL *</label>
        <input type="url" id="poster" name="poster" required
               placeholder="https://example.com/poster.jpg">
    </div>

    <div class="form-group">
        <label for="synopsis">Synopsis</label>
        <textarea id="synopsis" name="synopsis"></textarea>
    </div>

    <div class="form-group">
        <label for="trailer">Trailer Embed URL</label>
        <input type="url" id="trailer" name="trailer"
               placeholder="https://www.youtube.com/embed/...">
    </div>

    <button type="submit" class="btn">Add Movie</button>
</form>

<div id="movie-list" class="movie-list">
</div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 NETFLIX. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
